backend:
  name: git-gateway
  branch: main
  identity_url: https://starlit-tulumba-13313b.netlify.app/.netlify/identity
  gateway_url: https://starlit-tulumba-13313b.netlify.app/.netlify/git
  squash_merges: true

site_url: https://starlit-tulumba-13313b.netlify.app
display_url: https://starlit-tulumba-13313b.netlify.app

media_folder: public/images
public_folder: /images

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Business Info"
        name: "info"
        file: "src/content/info.json"
        fields:
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Hero Tagline", name: "tagline", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Hero Background Image", name: "hero_image", widget: "image" }

      - label: "Services"
        name: "services"
        file: "src/content/services.json"
        fields:
          - label: "Services List"
            name: "services"
            widget: "list"
            fields:
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }

      - label: "Projects"
        name: "projects"
        file: "src/content/projects.json"
        fields:
          - label: "Projects List"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Renovations"
                  - "Painting"
                  - "Concrete"
                  - "Decks & Fences"
                  - "Flooring"
                  - "Restoration"
                  - "Drywall"
                  - "Carpentry"
                  - "Doors & Windows"
                  - "Siding"
                  - "Cleaning"
                  - "Demolition"
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }